name: testes

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar dependências do núcleo
        run: pip install "numpy==2.4.6" "requests==2.34.2" "fastapi==0.162.4" "pydantic==2.14.3" "beautifulsoup4==4.15.0" "lxml==6.1.3" "pypdf==7.0.1" "pytest==9.2.0"
      # Os testes não precisam da LLM: conferem a base, a busca lexical, a LGPD,
      # as regras de segurança da saída, a verificação do agente e o gabarito.
      - name: Rodar os testes
        run: pytest -q
